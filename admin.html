  box.appendChild(lg);

  const hours = Array(24).fill(0);
  ORD.forEach(o => { hours[new Date(o.created_at).getHours()]++; });
  const hmax = Math.max(1, ...hours);
  const avg = paid.length ? Math.round(paid.reduce((s, o) => s + price(o), 0) / paid.length) : 0;
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
    const k = d.toDateString();
    days.push(paid.filter(o => new Date(o.created_at).toDateString() === k).reduce((s, o) => s + price(o), 0));
  }
  const weekAvg = Math.round(days.reduce((s, x) => s + x, 0) / 7);
  const cnt = {};
  ORD.forEach(o => { const c = String(o.contact || "").trim(); if (c) cnt[c] = (cnt[c] || 0) + 1; });
  const repeat = Object.entries(cnt).filter(([, n]) => n > 1).sort((x, y) => y[1] - x[1]).slice(0, 5);

  const an = el("div", "card");
  an.appendChild(el("div", "name", "▶ Аналитика"));
  const kp = el("div", "kpis");
  [["Средний чек, манат", avg], ["Прогноз на 7 дней, манат", weekAvg * 7], ["Повторные клиенты", repeat.length]]
    .forEach(([l, v]) => { const d = el("div", "", l); d.appendChild(el("b", "", String(v))); kp.appendChild(d); });
  an.appendChild(kp);
  an.appendChild(el("div", "mut", "Заказы по часам"));
  const hb = el("div", "bars"); hb.style.height = "110px";
  hours.forEach((n, h) => {
    const col = el("div", "bar"); const i = el("i");
    i.style.height = Math.max(2, Math.round(n / hmax * 100)) + "%";
    col.append(i, el("span", "", String(h)));
    hb.appendChild(col);
  });
  an.appendChild(hb);
  if (repeat.length) {
    an.appendChild(el("div", "mut", "Повторные клиенты:"));
    repeat.forEach(([c, n]) => an.appendChild(el("div", "mut", c + " — " + n + " заказ(ов)")));
  }
  const ed = el("button", "btn", "Экспорт по дням (CSV, 30 дней)"); ed.onclick = exportDays;
  const nb = el("button", "btn ghost", "🔔 Включить уведомления браузера");
  nb.onclick = async () => {
    if (!("Notification" in window)) { toast("Браузер не поддерживает"); return; }
    const r = await Notification.requestPermission();
    toast(r === "granted" ? "Уведомления включены" : "Уведомления отключены");
  };
  an.append(ed, nb);
  box.appendChild(an);
};
/* ===== партия 1: админка ===== */

document.getElementById("refresh").onclick = () => { tick(); toast("Обновлено"); };

window.addEventListener("online", () => { paintNet(); toast("Связь восстановлена"); tick(); });
window.addEventListener("offline", () => { paintNet(); toast("Нет связи с интернетом"); });

const _t13 = tick;
tick = async function () {
  await _t13();
  const n = ORD.filter(o => norm(o.status) === "new").length;
  const b = document.getElementById("n-orders");

show = function (v) { _show13(v); try { localStorage.setItem("view", v); } catch (e) {} };
const _login13 = login;
login = async function () {
  await _login13();
  const v = localStorage.getItem("view");
