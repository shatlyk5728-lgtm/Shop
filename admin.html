<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080a11">
<title>HAPP — Админ-панель</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230751b8%22/%3E%3Ctext x=%2232%22 y=%2245%22 text-anchor=%22middle%22 font-size=%2240%22 fill=%22white%22%3EH%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#080a11;--panel:#111827;--panel2:#172235;--line:#28364c;--tx:#f5f7fb;--mut:#9aa8bb;--blue:#299cff;--blue2:#0751b8;--red:#ff5968;--gold:#f5bd58;--green:#45d69a}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 30px);
font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tx);
background:radial-gradient(ellipse at 50% -10%,rgba(30,120,255,.2),transparent 42%),radial-gradient(ellipse at 100% 40%,rgba(180,26,43,.1),transparent 36%),var(--bg)}
.w{width:min(100%,720px);margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 22px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand img{width:48px;height:48px;object-fit:cover;border-radius:14px;border:1px solid #35445b;box-shadow:0 0 24px #167bff35}
.brand h1{font-size:clamp(20px,5vw,30px);font-weight:900;letter-spacing:-.6px;margin:0}
.brand small{display:block;color:#79baff;font-size:9px;letter-spacing:3px;font-weight:900}
.logout{border:1px solid #51303a;background:#21151d;color:#ff7380;border-radius:14px;padding:11px 15px;font:inherit;font-weight:800;cursor:pointer}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px;background:rgba(17,24,39,.92);border:1px solid var(--line);border-radius:20px;margin-bottom:18px}
.nav button{min-width:0;border:0;border-radius:14px;padding:12px 5px;background:transparent;color:var(--mut);font:inherit;font-weight:800;cursor:pointer}
.nav button.on{color:#fff;background:linear-gradient(135deg,#299cff,#0751b8);box-shadow:0 6px 18px #0877e844}
.card{padding:16px;margin:10px 0;background:linear-gradient(145deg,rgba(23,34,53,.98),rgba(14,19,30,.98));border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 28px #0004}
.name{font-weight:850;font-size:16px;overflow-wrap:anywhere}
.mut{color:var(--mut);font-size:13px;overflow-wrap:anywhere;margin-top:5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font-size:11px;font-weight:850;padding:5px 10px;border-radius:99px;white-space:nowrap;background:#28364c;color:#dce8fa}
.pill.pending{background:#493b1e;color:#ffd17b}.pill.paid{background:#123d33;color:#70e5b5}.pill.cancelled{background:#48212a;color:#ff9ba5}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:850;color:#fff;background:linear-gradient(135deg,#299cff,#0751b8);cursor:pointer;flex:1;min-width:105px}
.btn.gold{background:linear-gradient(135deg,#f5bd58,#b86a18);color:#201508}
.btn.red{background:#29171e;border:1px solid #67313c;color:#ff8993}
.btn.ghost{background:#202b3d;border:1px solid #35445b;color:#eaf2ff}
.btn:disabled{opacity:.5}
.empty{color:var(--mut);text-align:center;padding:25px 12px;background:#101725;border:1px dashed #35445b;border-radius:15px}
.err{color:#ff8993;min-height:18px;font-size:13px;margin:8px 0}
input,select,textarea{width:100%;border:1px solid #35445b;border-radius:13px;background:#0b111d;color:var(--tx);padding:13px;font:inherit;font-size:16px;margin:6px 0 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #299cff20}
textarea{min-height:130px;resize:vertical;font-family:ui-monospace,monospace;font-size:14px}
.login{max-width:390px;margin:12vh auto 0}
.login h2{margin:0 0 5px;font-size:23px}
.login p{margin:0 0 15px;color:var(--mut);font-size:13px}
.login .btn{width:100%}
.hide{display:none!important}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px}
.stat{background:#101725;border:1px solid var(--line);border-radius:15px;padding:13px}
.stat b{display:block;font-size:23px}.stat span{font-size:11px;color:var(--mut)}
.stock{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stock div{background:#0b111d;border:1px solid #26364d;border-radius:13px;padding:12px;color:var(--mut);font-size:12px}
.stock b{display:block;font-size:22px;color:var(--tx)}
.thread-card{display:flex;flex-direction:column;min-height:65vh}
.back{border:0;background:none;color:#80c1ff;font:inherit;font-weight:800;padding:4px 0 12px;cursor:pointer;text-align:left}
.msgs{flex:1;min-height:200px;max-height:55vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px;background:#0b111d;border:1px solid #26364d;border-radius:14px}
.m{max-width:86%;padding:10px 12px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere;background:#202c40;align-self:flex-start}
.m.seller{background:linear-gradient(135deg,#167bd7,#0751b8);align-self:flex-end}
.m small{display:block;font-size:10px;opacity:.7;margin-top:4px;text-align:right}
.reply{display:flex;gap:8px;margin-top:10px}.reply input{flex:1;min-width:0;margin:0}.reply .btn{flex:0 0 54px;min-width:54px}
.user-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.user-actions .btn{font-size:12px;padding:9px 8px}
.post-media{display:block;width:100%;max-height:420px;object-fit:contain;background:#080a11;border:1px solid #28364c;border-radius:13px;margin-top:10px}
.post-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:390px){.nav button{font-size:12px;padding:11px 2px}.brand img{width:42px;height:42px}.logout{padding:10px 11px;font-size:13px}}
</style>
</head>

    <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
    <div class="err" id="le"></div>
    <button class="btn" id="in">Войти</button>
  </section>

  <main id="app" class="hide">
    <nav class="nav">
      <button id="n-orders" class="on">Заказы</button>
      <button id="n-chats">Чаты</button>
      <button id="n-codes">Коды</button>
      <button id="n-users">Игроки</button>
    </nav>
    <section id="v-orders"></section>
    <section id="v-chats" class="hide">
      <div id="threads"></div>
      <div id="thread" class="hide">
        <button class="back" id="back">← Все чаты</button>
        <div class="card thread-card">
          <div class="name" id="tTitle" style="margin-bottom:10px"></div>
          <div class="msgs" id="tmsgs"></div>
          <div class="reply"><input id="reply" placeholder="Ответ покупателю" maxlength="1000"><button class="btn" id="rsend">➤</button></div>
        </div>
      </div>
    </section>
    <section id="v-codes" class="hide">
      <div class="card"><div class="name" style="margin-bottom:12px">Свободные промокоды</div><div class="stock" id="stock"></div></div>
      <div class="card"><div class="name">Добавить коды на склад</div>
        <select id="plan"></select><textarea id="list" placeholder="Вставьте коды, по одному в строке"></textarea>
        <div class="err" id="ce"></div><button class="btn" id="addc">Добавить коды</button>
      </div>
    </section>
    <section id="v-users" class="hide">
      <div class="stats" id="stats"></div>
      <div class="name" style="margin:16px 0 8px">Игроки</div><div id="users"></div>
      <div class="name" style="margin:22px 0 8px">Последние посты</div><div id="posts"></div>
    </section>
  </main>
</div>
<script>
const SB = "https://epqrrrffvbshtwgsmpue.supabase.co", KEY = "sb_publishable_wKtYkbXvwW3EvcbGGD-mfA_RylHFWzQ";
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const e=document.createElement(tag); if(cls)e.className=cls; if(txt!==undefined&&txt!==null)e.textContent=txt; return e; };
const LABEL={"std-week":"Стандарт · 1 неделя","std-month":"Стандарт · 1 месяц","vip-week":"VIP · 1 неделя","vip-month":"VIP · 1 месяц"};
const STAT={pending:"Ожидает оплаты",paid:"Оплачен",cancelled:"Отменён"};
let token=null, timer=null, curThread=null, lastCount=-1;
const stop=()=>{if(timer)clearInterval(timer);timer=null;};
const fmt=t=>t?new Date(t).toLocaleString("ru",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
async function api(path,opt={}){
 const r=await fetch(SB+path,{...opt,headers:{apikey:KEY,...(token?{Authorization:"Bearer "+token}:{}),"Content-Type":"application/json",...(opt.headers||{})}});
 const txt=await r.text(); if(!r.ok){let msg=txt;try{const j=JSON.parse(txt);msg=j.message||j.error_description||j.error||txt;}catch{}throw new Error(msg);}
 return txt?JSON.parse(txt):null;
}
async function rpc(name,args={}){
 return api("/rest/v1/rpc/"+name,{method:"POST",body:JSON.stringify(args)});
}
function logout(){token=null;stop();$("#app").classList.add("hide");$("#out").classList.add("hide");$("#login").classList.remove("hide");$("#pw").value="";}
async function login(){
 $("#le").textContent="";
 try{
  const d=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:$("#em").value.trim(),password:$("#pw").value})});
  token=d.access_token;
  // Verify the authenticated user has the admin app_metadata role before revealing panel data.
  const u=await api("/auth/v1/user");
  if(u.app_metadata?.role!=="admin"){token=null;throw new Error("Для этого аккаунта не назначена роль admin в app_metadata.");}
  $("#login").classList.add("hide");$("#app").classList.remove("hide");$("#out").classList.remove("hide");show("orders");
 }catch(e){$("#le").textContent=e.message||"Не удалось войти.";}
}
function show(v){
 stop();curThread=null;
 ["orders","chats","codes","users"].forEach(k=>$("#n-"+k).classList.toggle("on",k===v));
 ["orders","chats","codes","users"].forEach(k=>$("#v-"+k).classList.toggle("hide",k!==v));
 $("#thread").classList.add("hide");$("#threads").classList.remove("hide");
 if(v==="orders"){loadOrders();timer=setInterval(loadOrders,15000);}
 if(v==="chats"){loadChats();timer=setInterval(loadChats,5000);}
 if(v==="codes")loadStock();
 if(v==="users")loadUsers();
}
function showError(box,e){box.innerHTML="";box.appendChild(el("div","empty","Ошибка: "+e.message));}
async function loadOrders(){
 if(!token)return;const box=$("#v-orders");box.innerHTML="";
 try{
  const rows=await rpc("admin_panel_orders");
  if(!rows?.length){box.appendChild(el("div","empty","Заказов пока нет."));return;}
  rows.forEach(o=>{
   const c=el("article","card");const r=el("div","row");
   r.append(el("div","name",LABEL[o.plan]||o.plan),el("span","pill "+o.status,STAT[o.status]||o.status));
   c.append(r,el("div","mut","Контакт: "+o.contact),el("div","mut",fmt(o.created_at)+" · № "+o.id));
   if(o.status==="paid"&&o.code)c.appendChild(el("div","mut","Выданный код: "+o.code));
   if(o.status==="pending"){
    const a=el("div","acts"),ok=el("button","btn","Оплачено · выдать код"),no=el("button","btn red","Отменить");
    ok.onclick=async()=>{ok.disabled=true;try{const code=await rpc("admin_panel_approve_order",{p_id:o.id});alert("Код выдан:\n"+code);}catch(e){alert(e.message);}loadOrders();};
    no.onclick=async()=>{if(!confirm("Отменить заказ?"))return;try{await rpc("admin_panel_cancel_order",{p_id:o.id});}catch(e){alert(e.message);}loadOrders();};
    a.append(ok,no);c.appendChild(a);
   }box.appendChild(c);
  });
 }catch(e){showError(box,e);}
}
async function loadChats(){
 if(!token||curThread)return;const box=$("#threads");box.innerHTML="";
 try{
  const rows=await rpc("admin_panel_threads");
  if(!rows?.length){box.appendChild(el("div","empty","Сообщений пока нет."));return;}
  rows.forEach(t=>{
   const c=el("article","card");c.style.cssText="display:flex;align-items:center;gap:12px;cursor:pointer";
   c.appendChild(el("div","av","👤"));const mid=el("div","", "");
   mid.style.cssText="flex:1;min-width:0";
   mid.append(el("div","name","Покупатель "+t.thread.slice(0,8)),el("div","mut",t.sender==="seller"?"Вы: "+t.body:t.body));
   c.append(mid,el("div","mut",fmt(t.created_at)));c.onclick=()=>openThread(t.thread);box.appendChild(c);
  });
 }catch(e){showError(box,e);}
}
function openThread(t){
 curThread=t;lastCount=-1;stop();$("#threads").classList.add("hide");$("#thread").classList.remove("hide");
 $("#tTitle").textContent="Чат · "+t.slice(0,8);loadThread();timer=setInterval(loadThread,4000);
}
function closeThread(){curThread=null;stop();$("#thread").classList.add("hide");$("#threads").classList.remove("hide");loadChats();timer=setInterval(loadChats,5000);}
async function loadThread(){
 if(!curThread)return;try{
  const rows=await rpc("admin_panel_thread",{p_thread:curThread});const box=$("#tmsgs");
  const stick=box.scrollTop+box.clientHeight>=box.scrollHeight-40;box.innerHTML="";
  if(!rows?.length)box.appendChild(el("div","empty","Переписка пуста."));
  rows.forEach(m=>{const b=el("div","m "+(m.sender==="seller"?"seller":"client"),m.body);b.appendChild(el("small","",fmt(m.created_at)));box.appendChild(b);});
  if(stick)box.scrollTop=box.scrollHeight;
 }catch(e){showError($("#tmsgs"),e);}
}
async function sendReply(){
 const inp=$("#reply"),body=inp.value.trim();if(!body||!curThread)return;inp.value="";
 try{await rpc("admin_panel_reply",{p_thread:curThread,p_body:body});loadThread();}
 catch(e){inp.value=body;alert("Не отправлено: "+e.message);}inp.focus();
}
async function loadStock(){
 const box=$("#stock");box.innerHTML="";
 try{const rows=await rpc("admin_panel_stock");Object.keys(LABEL).forEach(k=>{const d=el("div","",LABEL[k]);d.appendChild(el("b","",String(rows.find(x=>x.plan===k)?.count||0)));box.appendChild(d);});}
 catch(e){showError(box,e);}
}
async function addCodes(){
 const lines=[...new Set($("#list").value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean))];$("#ce").textContent="";
 if(!lines.length){$("#ce").textContent="Вставьте хотя бы один код.";return;}
 try{const n=await rpc("admin_panel_add_codes",{p_plan:$("#plan").value,p_codes:lines});$("#list").value="";$("#ce").style.color="var(--green)";$("#ce").textContent="Добавлено кодов: "+n;loadStock();}
 catch(e){$("#ce").textContent="Ошибка: "+e.message;}
}
async function loadUsers(){
 const box=$("#users"),pb=$("#posts");box.innerHTML="";pb.innerHTML="";$("#stats").innerHTML="";
 try{
  const us=await rpc("admin_panel_users");
  const total=us.length,coins=us.reduce((s,u)=>s+(Number(u.coins)||0),0);
  [["Игроков",total],["Всего монет",coins]].forEach(([a,b])=>{const d=el("div","stat");d.append(el("b","",String(b)),el("span","",a));$("#stats").appendChild(d);});
  if(!total)box.appendChild(el("div","empty","Игроков пока нет."));
  us.forEach(u=>{
   const c=el("article","card");c.append(el("div","name","@"+u.username+" · ID "+u.user_no+" · 🪙 "+u.coins),el("div","mut",(u.email||"")+" · "+fmt(u.created_at)));
   const a=el("div","user-actions"),coin=el("button","btn ghost","🪙 Монеты"),prize=el("button","btn gold","🏆 Приз"),del=el("button","btn red","Удалить");
   coin.onclick=async()=>{const n=parseInt(prompt("Сколько монет добавить? (минус — списать)","10"),10);if(!Number.isFinite(n)||n===0)return;try{await rpc("admin_panel_adjust_coins",{p_user_no:u.user_no,p_delta:n});loadUsers();}catch(e){alert(e.message);}};
   prize.onclick=async()=>{const p=prompt("Тариф приза: "+Object.keys(LABEL).join(", "),"vip-month");if(!p)return;try{const code=await rpc("admin_panel_award",{p_username:u.username,p_plan:p.trim()});alert("Код выдан:\n"+code);}catch(e){alert(e.message);}};
   del.onclick=async()=>{if(!confirm("Удалить игрока @"+u.username+" и его посты?"))return;try{await rpc("admin_panel_delete_user",{p_user_no:u.user_no});loadUsers();}catch(e){alert(e.message);}};
   a.append(coin,prize,del);c.appendChild(a);box.appendChild(c);
  });
  const ps=await rpc("admin_panel_posts");
  if(!ps.length)pb.appendChild(el("div","empty","Постов пока нет."));
  ps.forEach(p=>{
   const c=el("article","card"),head=el("div","post-head");
   head.append(el("div","name","@"+p.username+" · "+p.grp),el("div","mut",fmt(p.created_at)));c.appendChild(head);
   if(p.body)c.appendChild(el("div","mut",p.body));
   if(p.media_path){
    const url=SB+"/storage/v1/object/public/media/"+p.media_path;
    const m=el(p.media_type==="video"?"video":"img","post-media");m.src=url;
    if(p.media_type==="video"){m.controls=true;m.playsInline=true;m.preload="metadata";}
    else{m.alt="Фото из публикации";m.loading="lazy";m.onerror=()=>{m.replaceWith(el("div","empty","Не удалось загрузить фото. Проверьте файл в Storage → media."));};}
    c.appendChild(m);
   }
   const d=el("button","btn red","Удалить пост");d.style.marginTop="12px";
   d.onclick=async()=>{if(!confirm("Удалить публикацию?"))return;try{const path=await rpc("admin_panel_delete_post",{p_id:p.id});if(path)await api("/storage/v1/object/media/"+path,{method:"DELETE"}).catch(()=>{});loadUsers();}catch(e){alert(e.message);}};
   c.appendChild(d);pb.appendChild(c);
  });
 }catch(e){showError(box,e);}
}
Object.keys(LABEL).forEach(k=>{const o=el("option","",LABEL[k]);o.value=k;$("#plan").appendChild(o);});
$("#in").onclick=login;$("#pw").onkeydown=e=>{if(e.key==="Enter")login();};$("#out").onclick=logout;
["orders","chats","codes","users"].forEach(k=>$("#n-"+k).onclick=()=>show(k));
$("#back").onclick=closeThread;$("#rsend").onclick=sendReply;
$("#reply").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();sendReply();}};
$("#addc").onclick=addCodes;
</script>
</body>
</html>
