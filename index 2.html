async function loadPrev() {
  try { const r = await rpc("get_messages", {p_thread: thread}); prev.seller = r.length ? r[r.length - 1] : null; } catch (e) {}
  await Promise.all(GROUPS.map(async ([k]) => { try { const r = await rpc("get_posts", {p_group: k}); prev[k] = r.length ? r[r.length - 1] : null; } catch (e) {} }));
  renderChats();
}
function crow(av, adm, name, tag, line, time, onclick) {
  const r = el("div", "crow" + (onclick ? " k" : ""));
  r.appendChild(el("div", "cav" + (adm ? " ad" : ""), av));
  const m = el("div", "cm"), n = el("div", "cn", name);
  if (tag) n.appendChild(el("span", "tag", tag));
  m.append(n, line instanceof Node ? line : el("div", "cp", line));
  r.appendChild(m);
  if (time) r.appendChild(el("div", "ct", time));
  if (onclick) r.onclick = onclick;
  return r;
}
function renderChats() {
  const box = $("#chatlist"); box.innerHTML = "";
  const s = prev.seller;
  box.appendChild(crow("🛡", true, t("sellerChat"), t("admin"), s ? (s.sender === "client" ? "✓ " : "") + s.body : t("sellerEmpty"), s ? hm(s.created_at) : "", openChat));
  GROUPS.forEach(([k, i]) => {
    const p = prev[k];
    box.appendChild(crow(i, false, t("g-" + k), "", p ? "@" + p.username + ": " + (p.body || t("media")) : t("noMsg"), p ? hm(p.created_at) : "", () => openGrp(k)));
  });
}

/* ---------- участники ---------- */
const isOn = m => m.last_seen && Date.now() - new Date(m.last_seen) < 120000;
async function loadMembers() {
  try { members = await rpc("get_members", {}); memErr = !Array.isArray(members); } catch (e) { memErr = true; }
  renderPeople();
}
function fillMembers(box) {
  box.innerHTML = "";
  const n = (members && !memErr ? members.length : 0) + 1;
  box.appendChild(el("p", "hint", t("count") + n));
  box.appendChild(crow("👑", true, t("admin"), "ADMIN", t("owner"), "", null));
  if (memErr) { box.appendChild(el("div", "empty", t("noMem"))); return; }
  (members || []).forEach(m => {
    const on = isOn(m), l = el("div", "cp");
    l.append(el("span", "dot" + (on ? " on" : "")), document.createTextNode(t(on ? "online" : "offline")));
    const mine = me && m.user_no === me.user_no;
    box.appendChild(crow((m.username || "?")[0].toUpperCase(), false, "@" + m.username + (mine ? " (" + t("you") + ")" : ""), "", l, "ID " + m.user_no, null));
  });
}
function renderPeople() { fillMembers($("#people")); if ($("#mBg").classList.contains("on")) fillMembers($("#mList")); }

/* ---------- профиль ---------- */
async function loadMe() {
  me = null;
  if (tk()) { try { me = (await rpc("get_me", {p_token: tk()}))[0]; } catch (e) { if (/Сессия/.test(em(e))) ls.set("ptoken", ""); } }
  if (me) touch();
  renderMe(); renderPeople();
}
const touch = () => { if (me && !document.hidden) rpc("touch", {p_token: tk()}).catch(() => {}); };
async function act(fn, okText) {
  try { const r = await fn(); note = okText ? okText(r) : ""; } catch (e) { note = "⚠ " + em(e); }
  loadMe();
}
function renderMe() {
  const b = $("#me"); b.innerHTML = "";
  const c = el("div", "card");
  if (me) {
    const r = el("div", "pf"), w = el("div");
    w.append(el("b", "", "@" + me.username), el("div", "sub", "ID: " + me.user_no));
    r.append(el("div", "av2", me.username[0].toUpperCase()), w, el("div", "coins", "🪙 " + me.coins));
    const a = el("div", "acts");
    const bn = el("button", "btn", t(me.can_bonus ? "bonus" : "bonusDone")); bn.disabled = !me.can_bonus;
    bn.onclick = () => act(() => rpc("claim_bonus", {p_token: tk()}), () => t("bonusOk"));
    const by = el("button", "btn ghost", t("redeem"));
    by.onclick = () => { if (confirm(t("redeemQ"))) act(() => rpc("redeem_week", {p_token: tk()}), code => t("yourCode") + code); };
    const mc = el("button", "btn ghost", t("myCodes"));
    mc.onclick = () => act(() => rpc("my_codes", {p_token: tk()}), rows => rows.length ? t("codes") + rows.map(x => x.code).join(", ") : t("noCodes"));
    a.append(bn, by, mc); c.append(r, a);
  } else {
    const e1 = el("input"); e1.type = "email"; e1.placeholder = t("email"); e1.maxLength = 120; e1.autocomplete = "email";
    const un = el("input"); un.placeholder = t("namePh"); un.maxLength = 20; un.autocapitalize = "none";
    const g = el("button", "btn", t("create"));
    g.onclick = () => act(async () => { const r = await rpc("register", {p_email: e1.value, p_username: un.value}); ls.set("ptoken", r[0].token); }, () => "");
    c.append(el("h3", "", t("profT")), e1, un, g, el("p", "hint", t("hintReg")));
  }
  if (note) c.appendChild(el("div", "ok" + (note[0] === "⚠" ? " bad" : ""), note));
  const l = el("div", "card"), ls1 = el("div", "lsel");
  l.appendChild(el("h3", "", "🌐 " + t("lang")));
  Object.keys(LF).forEach(k => { const x = el("button", k === lang ? "on" : "", LF[k]); x.onclick = () => setLang(k); ls1.appendChild(x); });
  l.appendChild(ls1);
  b.append(c, l);
}

/* ---------- группы ---------- */
function openGrp(k) {
  grp = k; lastId = -1; const g = GROUPS.find(x => x[0] === k);
  $("#gT").textContent = g[1] + " " + t("g-" + k); $("#gE").textContent = ""; $("#gBg").classList.add("on");
  loadGrp(); gTimer = setInterval(loadGrp, 5000);
}
function closeGrp() { $("#gBg").classList.remove("on"); clearInterval(gTimer); loadPrev(); }
async function loadGrp() {
  try {
    const rows = await rpc("get_posts", {p_group: grp});
    const last = rows.length ? rows[rows.length - 1].id : 0;
    if (last === lastId) return;
    const box = $("#gM"), stick = lastId === -1 || box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
    lastId = last; box.innerHTML = "";
    if (!rows.length) box.appendChild(el("div", "empty", t("quiet")));
    rows.forEach(r => {
      const b = el("div", "m " + (me && r.user_no === me.user_no ? "me" : "sel"));
      b.appendChild(el("span", "u", "@" + r.username));
      if (r.body) b.appendChild(document.createTextNode(r.body));
      if (r.media_path) {
        const v = r.media_type === "video", m = el(v ? "video" : "img");
        m.src = SB + "/storage/v1/object/public/media/" + r.media_path;
        if (v) { m.controls = true; m.preload = "metadata"; m.playsInline = true; }
        b.appendChild(m);
      }
      b.appendChild(el("small", "", hm(r.created_at))); box.appendChild(b);
    });
    if (stick) box.scrollTop = box.scrollHeight;
  } catch (e) {}
}
async function sendGrp() {
  const inp = $("#gTxt"), text = inp.value.trim(), f = $("#gF").files[0], err = $("#gE");
  err.textContent = "";
  if (!me) { err.textContent = t("needProf"); return; }
  if (!text && !f) return;
  if (f && f.size > 20 * 1024 * 1024) { err.textContent = t("big"); return; }
  $("#gS").disabled = true;
  try {
    let path = null, type = null;
    if (f) {
      type = f.type.startsWith("video") ? "video" : "image";
      const ext = ((f.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g, "") || "bin").slice(0, 5);
      path = me.user_no + "/" + crypto.randomUUID() + "." + ext;
      const r = await fetch(SB + "/storage/v1/object/media/" + path, {method:"POST", headers:{apikey:KEY, "Content-Type":f.type}, body:f});
      if (!r.ok) throw new Error(t("upFail"));
    }
    await rpc("send_post", {p_token: tk(), p_group: grp, p_body: text, p_media_path: path, p_media_type: type});
    inp.value = ""; $("#gF").value = ""; lastId = -1; loadGrp();
  } catch (e) { err.textContent = em(e); }
  $("#gS").disabled = false;
}

/* ---------- события ---------- */
BG.concat(BG[0]).forEach(s => { const i = el("img"); i.src = s; i.alt = ""; $("#bgc").appendChild(i); });
document.querySelectorAll("#tabs button").forEach(b => { b.onclick = () => go(b.dataset.go); });
$("#lg").onclick = () => { const o = ["ru", "tk", "en"]; setLang(o[(o.indexOf(lang) + 1) % 3]); };
$("#t-std").onclick = () => setTab("std");
$("#t-vip").onclick = () => setTab("vip");
$("#tourBtn").onclick = () => openGrp("tournaments");
$("#closeChat").onclick = closeChat;
$("#send").onclick = sendChat;
$("#txt").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); sendChat(); } };
$("#orderBg").onclick = e => { if (e.target.id === "orderBg") closeOrder(); };
$("#gX").onclick = closeGrp;
$("#gS").onclick = sendGrp;
$("#gTxt").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); sendGrp(); } };
$("#gMem").onclick = () => { $("#mBg").classList.add("on"); loadMembers(); };
$("#mX").onclick = () => $("#mBg").classList.remove("on");
$("#mBg").onclick = e => { if (e.target.id === "mBg") $("#mBg").classList.remove("on"); };
setInterval(touch, 60000);

applyLang();
loadMe();
checkOrder();
</script>
