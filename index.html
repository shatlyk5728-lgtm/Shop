<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Happ VPN — №1 в Туркменистане</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2327e07a'/%3E%3Ctext x='32' y='44' font-size='40' text-anchor='middle' fill='%2302140a' font-family='Arial' font-weight='bold'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0a0e1a;--panel:#131824;--panel2:#1a2030;--line:#242b3d;
  --tx:#f5f7fa;--mut:#8a94a8;--a1:#27e07a;--a2:#0a8f45;
  --v1:#ffd166;--v2:#ff7a18;--amb:#ffd17b;
  --danger:#ff5964;--ok:#55d6a0;--info:#4dabff;--warn:#ffb020;
  --shadow:0 8px 32px rgba(0,0,0,.4);--shadow-lg:0 16px 48px rgba(0,0,0,.5);
  --r-sm:10px;--r-md:16px;--r-lg:22px;--r-xl:28px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  font-family:var(--font);
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f5f7fb;--panel:#fff;--panel2:#eef1f7;--line:#dde3ed;
  --tx:#0a0e1a;--mut:#5a6478;--shadow:0 8px 32px rgba(0,0,0,.08);--shadow-lg:0 16px 48px rgba(0,0,0,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:var(--bg);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--tx);background:transparent!important;
  font-size:15px;line-height:1.5;padding:18px 0 calc(env(safe-area-inset-bottom) + 108px);
  transition:background .3s,color .3s;font-family:var(--font)}
button,input,textarea,select{font:inherit;color:inherit}
button{touch-action:manipulation;transition:transform .15s,opacity .15s,background .2s}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.45;cursor:not-allowed}
img{max-width:100%;height:auto}
a{color:var(--a1);text-decoration:none}

/* ===== ФОН ===== */
.bgc{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:radial-gradient(ellipse at 50% -10%,rgba(39,224,122,.18),transparent 50%),var(--bg)}
html[data-theme="light"] .bgc{background:radial-gradient(ellipse at 50% -10%,rgba(39,224,122,.12),transparent 50%),var(--bg)}
.bgc img{display:none}

/* ===== МОДАЛКИ ===== */
.bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);display:none;
  align-items:flex-end;justify-content:center;padding:0;backdrop-filter:blur(4px);
  animation:fadeIn .2s}
.bg.on{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

.sheet{width:min(100%,560px);max-height:90dvh;overflow:auto;padding:20px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 0 0;
  box-shadow:var(--shadow-lg);padding-bottom:calc(20px + env(safe-area-inset-bottom));
  animation:slideUp .3s cubic-bezier(.2,.8,.2,1)}
.sheet.f{height:100dvh;max-height:none;border-radius:0;display:flex;flex-direction:column;width:100%;max-width:680px}

/* ===== ТИПОГРАФИКА ===== */
h1,h2,h3,h4{margin:0 0 .5em;font-weight:800;letter-spacing:-.02em;line-height:1.2}
h1{font-size:clamp(26px,7vw,36px);font-weight:900}
h2{font-size:20px}h3{font-size:17px}h4{font-size:15px}
p{margin:0 0 .8em}

/* ===== HERO ===== */
.wrap{width:min(100% - 32px,560px);margin:0 auto}
.hero{text-align:center;position:relative;padding:36px 16px 28px}
.hlogo{width:112px;height:112px;border-radius:30px;display:block;margin:0 auto 16px;
  object-fit:cover;box-shadow:0 0 0 8px rgba(39,224,122,.1),0 0 40px rgba(39,224,122,.35),0 16px 44px rgba(0,0,0,.55);
  animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hero h1{background:linear-gradient(90deg,#fff,#7dffb4 55%,#27e07a);
  -webkit-background-clip:text;background-clip:text;color:transparent;margin:12px auto 8px}
html[data-theme="light"] .hero h1{background:linear-gradient(90deg,#0a0e1a,#0a8f45 55%,#27e07a);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);max-width:380px;margin:0 auto;font-size:14px}
.hero:after{content:"HAPP VPN";display:block;width:max-content;margin:14px auto 0;
  color:#4dff94;font-size:10px;letter-spacing:4px;font-weight:900}
.crown{display:inline-block;margin:16px auto 0;padding:8px 16px;border-radius:99px;font-weight:900;
  font-size:12px;letter-spacing:.6px;color:#02140a;background:linear-gradient(135deg,#27e07a,#00b8ff 50%,#7c4dff);
  box-shadow:0 6px 24px rgba(39,224,122,.4);animation:shimmer 3s infinite}
@keyframes shimmer{0%,100%{filter:brightness(1)}50%{filter:brightness(1.2)}}
.apple{display:block;margin:12px auto 0;color:#c4ffdc;font-size:13px;font-weight:700}

/* ===== КНОПКИ ===== */
.btn{border:0;border-radius:var(--r-sm);padding:12px 18px;background:linear-gradient(135deg,var(--a1),var(--a2));
  color:#02140a;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(39,224,122,.3);
  min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 8px 26px rgba(39,224,122,.4)}
.btn.ghost{background:var(--panel2);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel)}
.btn.dark{background:var(--panel2);color:var(--tx);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#ff5964,#c41e3a);color:#fff}
.btn.info{background:linear-gradient(135deg,#4dabff,#0751b8);color:#fff}
.btn.warn{background:linear-gradient(135deg,#ffb020,#c96b13);color:#1a1207}
.btn.sm{padding:8px 12px;min-height:36px;font-size:13px}
.btn.full{width:100%}
.btn.icon{padding:10px;min-width:44px;border-radius:50%}

/* ===== ЯЗЫК ===== */
.lng{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 14px);border:0;border-radius:99px;
  padding:8px 14px;font-weight:800;font-size:13px;color:var(--tx);background:rgba(255,255,255,.08);
  cursor:pointer;backdrop-filter:blur(10px)}
.lng:hover{background:rgba(255,255,255,.15)}
.balchip{position:absolute;left:16px;top:calc(env(safe-area-inset-top) + 14px);border:0;border-radius:99px;
  padding:8px 14px;font-weight:800;font-size:13px;color:#02140a;background:linear-gradient(135deg,#27e07a,#0a8f45);
  cursor:pointer;box-shadow:0 4px 16px rgba(39,224,122,.35)}
.balchip:hover{filter:brightness(1.1)}

/* ===== СЕГМЕНТЫ ===== */
.seg{display:flex;gap:6px;padding:5px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-md);margin:8px 0 16px}
.seg button{flex:1;border:0;border-radius:var(--r-sm);padding:12px;background:transparent;color:var(--mut);font-weight:800;cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#02140a;box-shadow:0 4px 14px rgba(39,224,122,.3)}
.seg button.vip{color:var(--amb)}
.seg button.vip.on{background:linear-gradient(135deg,var(--v1),var(--v2));color:#1a1207}

/* ===== КАРТОЧКИ ТАРИФОВ ===== */
.plan{display:flex;align-items:center;gap:14px;padding:18px;margin:12px 0;
  background:linear-gradient(145deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);
  transition:transform .2s,box-shadow .2s,border-color .2s;position:relative;overflow:hidden}
.plan:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--a1)}
.plan.vip{border-color:rgba(255,209,102,.5);
  background:linear-gradient(145deg,rgba(255,209,102,.12),rgba(23,20,15,.95))}
.plan.vip:hover{border-color:var(--amb)}
.plan.hit:before{content:"🔥 ХИТ";position:absolute;top:0;right:0;padding:3px 10px;
  background:linear-gradient(135deg,#ff3d71,#c41e3a);color:#fff;font-size:9px;font-weight:900;letter-spacing:.5px;
  border-radius:0 0 0 10px}
.plan.save:before{content:"💰 ВЫГОДНО";position:absolute;top:0;right:0;padding:3px 10px;
  background:linear-gradient(135deg,#27e07a,#0a8f45);color:#02140a;font-size:9px;font-weight:900;letter-spacing:.5px;
  border-radius:0 0 0 10px}
.gb{width:68px;height:68px;flex:none;border-radius:18px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(39,224,122,.15);color:#6dffa8;
  font-weight:900;transition:transform .2s}
.plan:hover .gb{transform:scale(1.05)}
.gb b{font-size:26px;line-height:1}.gb small{font-size:11px;opacity:.8}
.plan.vip .gb{background:rgba(255,209,102,.15);color:var(--amb)}
.i{flex:1;min-width:0}
.i h2{font-size:18px;margin:2px 0 4px;font-weight:800}
.sub{font-size:12px;color:var(--mut)}
.badge{display:inline-block;background:rgba(255,209,102,.2);color:var(--amb);font-size:10px;
  font-weight:900;padding:3px 8px;border-radius:99px;letter-spacing:.5px}
.price{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.price b{font-size:24px;font-weight:900}
.price small{font-size:11px;color:var(--mut)}
.buy{margin-top:10px;padding:9px 16px;font-size:13px;border:0;border-radius:var(--r-sm);
  background:linear-gradient(135deg,var(--a1),var(--a2));color:#02140a;font-weight:800;cursor:pointer}
.plan.vip .buy{background:linear-gradient(135deg,var(--v1),var(--v2));color:#1a1207}

/* ===== КАРТОЧКИ ===== */
.card{padding:18px;margin:14px 0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:16px}
.card p{color:var(--mut);font-size:13px;overflow-wrap:anywhere}

/* ===== СПИСОК ШАГОВ ===== */
.steps{padding-left:0;margin:10px 0;color:var(--mut);counter-reset:step;list-style:none}
.steps li{padding:8px 0 8px 36px;position:relative;counter-increment:step}
.steps li:before{content:counter(step);position:absolute;left:0;top:6px;width:26px;height:26px;
  border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));color:#02140a;
  display:grid;place-items:center;font-weight:900;font-size:13px}

/* ===== КОД ===== */
.code{padding:14px;margin:12px 0;border:1px dashed var(--a1);border-radius:var(--r-sm);
  background:rgba(39,224,122,.08);font-size:18px;font-weight:800;overflow-wrap:anywhere;user-select:all;
  cursor:pointer;transition:background .2s;font-family:'SF Mono',Monaco,monospace}
.code:hover{background:rgba(39,224,122,.15)}
.code:active{transform:scale(.99)}

/* ===== FAQ ===== */
.fq{background:var(--panel2);border-radius:var(--r-sm);padding:14px 16px;margin:8px 0;
  border:1px solid transparent;transition:border-color .2s}
.fq:hover{border-color:var(--line)}
.fq summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.fq summary::-webkit-details-marker{display:none}
.fq summary:after{content:"+";font-size:20px;color:var(--a1);font-weight:300;transition:transform .2s}
.fq[open] summary:after{transform:rotate(45deg)}
.fq p{margin:10px 0 0;color:var(--mut);font-size:13px}

/* ===== ВКЛАДКИ ===== */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));
  width:min(96%,560px);display:flex;gap:2px;padding:6px;background:rgba(10,14,26,.94);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);
  border-radius:30px;z-index:20;box-shadow:0 12px 40px rgba(0,0,0,.5)}
html[data-theme="light"] .tabs{background:rgba(255,255,255,.94)}
.tabs button{flex:1;min-width:0;border:0;background:none;color:var(--mut);font-size:10px;font-weight:700;
  border-radius:22px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:background .2s,color .2s;position:relative}
.tabs button span{font-size:20px;line-height:1}
.tabs button b{font-size:9.5px;font-weight:800}
.tabs button.on{background:rgba(39,224,122,.18);color:var(--a1)}
.nb{position:absolute;top:2px;right:calc(50% - 16px);min-width:18px;height:18px;border-radius:9px;
  background:var(--a1);color:#02140a;font:800 10px/1 inherit;font-style:normal;display:grid;place-items:center;padding:0 5px;
  box-shadow:0 2px 6px rgba(39,224,122,.5);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

/* ===== ЧАТЫ (Telegram-style) ===== */
#chatlist,#people{margin:0 -16px}
.crow{position:relative;background:transparent;border:0;border-radius:0;margin:0;padding:12px 16px;gap:14px;
  align-items:flex-start;display:flex;min-width:0;transition:background .15s}
.crow::after{content:"";position:absolute;left:92px;right:0;bottom:0;border-bottom:1px solid var(--line)}
.crow:last-child::after{display:none}
.crow.k{cursor:pointer}
.crow.k:active{background:rgba(255,255,255,.04)}
.crow.pin{background:rgba(39,224,122,.05)}
.cav{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:800;
  background:linear-gradient(135deg,var(--a1),var(--a2));flex:none;color:#02140a;overflow:hidden}
.cav img{width:100%;height:100%;object-fit:cover}
.crow:nth-child(3n+2) .cav{background:linear-gradient(135deg,#00d4a1,#00704f)}
.crow:nth-child(3n) .cav{background:linear-gradient(135deg,#b6f23a,#4a8f0a)}
.cav.sm{width:44px;height:44px;font-size:20px}
.cav.ad{background:linear-gradient(135deg,var(--v1),var(--v2));color:#1a1207}
.cm{flex:1;min-width:0}
.cn{font-weight:800;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:16px}
.cp{color:var(--mut);font-size:14px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;line-height:1.35;margin-top:2px}
.ct{font-size:12px;color:var(--mut);align-self:flex-start;white-space:nowrap;margin-top:3px;text-align:right}
.tag{font-size:9px;font-weight:900;padding:2px 7px;border-radius:99px;background:rgba(255,209,102,.2);color:var(--amb)}
.ub{min-width:22px;height:22px;border-radius:11px;background:var(--a1);color:#02140a;font-size:12px;
  font-weight:800;display:grid;place-items:center;padding:0 6px;margin:6px 0 0 auto}
.pn{opacity:.5;margin-top:6px}
.dot{width:9px;height:9px;border-radius:50%;background:#555;display:inline-block;margin-right:6px}
.dot.on{background:var(--a1);box-shadow:0 0 8px var(--a1)}

/* ===== ЧАТ ОКНО ===== */
.sheet.f.tg{background:var(--bg)}
.tgh{justify-content:flex-start;gap:12px;padding:4px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:0}
.tgh .x{border:0;background:none;font-size:34px;line-height:1;width:34px;color:var(--a1);cursor:pointer}
.hm{display:flex;flex-direction:column;line-height:1.25}
.hm b{font-size:15px}.hm span{font-size:12px;color:var(--a1)}
.hintbar{background:rgba(39,224,122,.15);color:#9dffc6;font-size:13px;padding:12px;border-radius:var(--r-sm);
  margin:10px 0 0;font-weight:600;border:1px solid rgba(39,224,122,.3)}
.msgs{overflow:auto;flex:1;min-height:120px;padding:12px 4px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.m{max-width:82%;padding:10px 14px 8px;border-radius:18px 18px 18px 6px;background:var(--panel2);color:var(--tx);
  align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap;font-size:14.5px;
  animation:slideIn .25s ease-out;position:relative}
.m.me{align-self:flex-end;background:linear-gradient(135deg,#27e07a,#0a8f45);color:#fff;border-radius:18px 18px 6px 18px}
.m small{display:block;margin-top:5px;text-align:right;color:var(--mut);font-size:10px}
.m.me small{color:rgba(255,255,255,.75)}
.m .u{display:block;color:var(--a1);font-size:11px;font-weight:800;margin-bottom:3px}
.m.me .u{color:rgba(255,255,255,.9)}
.m img,.m video{display:block;max-width:100%;max-height:340px;border-radius:12px;margin-top:8px}
.m.ph{padding:4px}
.m.ph img{margin:0;cursor:zoom-in}
.m.ph small{padding:2px 10px 4px}
.m.ord{border:1px solid rgba(39,224,122,.5);background:rgba(39,224,122,.08)}
.empty{margin:auto;text-align:center;color:var(--mut);font-size:13px;padding:32px}
.tgi{align-items:center;padding-top:10px;gap:8px}
.tgi input,.row input{border-radius:99px!important;margin:0!important;background:var(--panel2)!important;
  border:1px solid var(--line)!important;padding:12px 16px}
.clip{width:46px;height:46px;flex:none;display:grid;place-items:center;font-size:20px;cursor:pointer;
  border-radius:50%;background:var(--panel2);border:1px solid var(--line);transition:background .2s}
.clip:hover{background:var(--panel)}
.snd{border-radius:50%!important;width:46px;height:46px;min-height:0;padding:0!important;flex:none;font-size:18px}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1}
.err{color:var(--danger);font-size:12px;margin:8px 0;overflow-wrap:anywhere}
.hint{color:var(--mut);font-size:12px}

/* ===== ФОРМЫ ===== */
.sheet input:not([type=file]),.card input{width:100%;min-width:0;padding:14px 16px;border:1px solid var(--line);
  border-radius:var(--r-sm);outline:none;background:var(--panel2);color:var(--tx);margin:8px 0;
  transition:border-color .2s,background .2s}
.sheet input:focus,.card input:focus{border-color:var(--a1);background:var(--panel)}

/* ===== ПРОФИЛЬ ===== */
.pf{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.av2{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(135deg,var(--a1),var(--a2));font-size:22px;font-weight:800;
  box-shadow:0 0 0 3px rgba(39,224,122,.3)}
.av2 img{width:100%;height:100%;object-fit:cover}
.coins{margin-left:auto;font-weight:900;color:var(--amb);white-space:nowrap;font-size:15px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts .btn{flex:1 1 145px}

/* ===== ГАЛЕРЕЯ ===== */
.brand-gallery{margin:4px 0 24px}
.gallery-heading{margin:0 0 14px}
.eyebrow{font-size:10px;letter-spacing:2px;color:var(--a1);font-weight:900;display:block;margin-bottom:4px}
.gallery-heading h2{font-size:22px;line-height:1.15;margin:5px 0 4px}
.gallery-heading p{margin:0;color:var(--mut);font-size:13px}
.poster-rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 0 12px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.poster-rail::-webkit-scrollbar{display:none}
.poster-card{flex:0 0 min(60vw,210px);min-width:0;overflow:hidden;scroll-snap-align:start;
  border-radius:var(--r-md);background:var(--panel);border:1px solid var(--line);
  box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.poster-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.poster-card img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;cursor:zoom-in}
.poster-card.w img{aspect-ratio:auto;object-fit:contain}
.poster-caption{display:flex;flex-direction:column;gap:2px;padding:10px 12px}
.poster-caption b{font-size:12px}.poster-caption span{font-size:10px;color:var(--mut)}
.gallery-hint{display:flex;justify-content:space-between;align-items:center;color:var(--mut);
  font-size:11px;padding:2px 4px}
.gallery-hint span{color:var(--a1);font-size:17px}

/* ===== FEATURES ===== */

function copyToClipboard(text) {
  try {
    navigator.clipboard.writeText(text);
    if (navigator.vibrate) navigator.vibrate(30);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
}

async function sendShot(f) {

$("#mBg").onclick = e => { if (e.target.id === "mBg") $("#mBg").classList.remove("on"); };
$("#gBuy").onclick = () => go("shop");
$("#hChat").onclick = openChat;
$("#shot").onchange = e => sendShot(e.target.files[0]);
$("#lbBg").onclick = e => { if (e.target.id === "lbBg") $("#lbBg").classList.remove("on"); };

// FAB scroll-to-top
window.addEventListener("scroll", () => {
  $("#fabScroll").classList.toggle("hide", window.scrollY < 300);
});
$("#fabScroll").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });

// Keyboard shortcuts
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if ($("#lbBg").classList.contains("on")) $("#lbBg").classList.remove("on");
    if ($("#orderBg").classList.contains("on")) closeOrder();
    if ($("#chatBg").classList.contains("on")) closeChat();
    if ($("#gBg").classList.contains("on")) closeGrp();
    if ($("#mBg").classList.contains("on")) $("#mBg").classList.remove("on");
  }
});

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
applyTheme();
applyLang();
startPromo();
loadMe();
loadPrev();
checkOrder();
setInterval(touch, 60000);
setInterval(loadPrev, 15000);

// Приветствие
setTimeout(() => {
  const seen = ls.get("welcome");
  if (!seen) {
    toast("👋 Добро пожаловать в Happ VPN!", "ok", 4000);
    ls.set("welcome", "1");
  }
}, 1000);

// Регистрация Service Worker (offline)
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("data:text/javascript," + encodeURIComponent(`
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => self.clients.claim());
    self.addEventListener('fetch', e => {
      if (e.request.method === 'GET') {
        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
      }
    });
  `)).catch(() => {});
}

console.log("%c🚀 Happ VPN v2.0 — улучшенный UI + 50 функций", "color:#27e07a;font-weight:900;font-size:14px");
