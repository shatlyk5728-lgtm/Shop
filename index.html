<style>

:root{
  color-scheme:dark;
  --bg:#09090c;--panel:#15151b;--panel2:#1d1d25;--line:#30303a;
  --tx:#f5f5f7;--mut:#a5a5b2;--a1:#ef5964;--a2:#9d1825;
  --v1:#d7ad58;--v2:#8d6425;--amb:#f2c56b;
  --danger:#ff737d;--ok:#55d6a0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--tx);background:transparent!important;
  font-size:15px;line-height:1.45;padding:18px 0 calc(env(safe-area-inset-bottom) + 108px)}
button,input{font:inherit}
button{touch-action:manipulation}
.bg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.72);display:none;
  align-items:flex-end;justify-content:center;padding:0}
.bg.on{display:flex}
.bgc{position:fixed;inset:0;z-index:-1;display:grid;grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(3,1fr);overflow:hidden;background:
  radial-gradient(ellipse at 50% 0%,rgba(130,20,32,.25),transparent 48%),#09090c}
.bgc img{width:100%;height:100%;object-fit:cover;opacity:.18}
.bgc:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(9,9,12,.55),rgba(9,9,12,.92))}
.pg{width:100%;min-height:70vh}
.hide{display:none!important}
.wrap{width:min(100% - 32px,560px);margin:0 auto}
.hero{text-align:center;position:relative;padding:28px 16px 24px}
.hlogo{width:104px;height:104px;border-radius:26px;display:block;margin:0 auto 14px;
  object-fit:cover;box-shadow:0 12px 32px rgba(0,0,0,.55);background:#17171d}
.hero h1{font-size:26px;line-height:1.15;margin:10px auto 6px;font-weight:850;letter-spacing:-.5px}
.hero p{color:var(--mut);max-width:420px;margin:0 auto;font-size:14px}
.lng{position:absolute;right:16px;top:8px;border:1px solid var(--line);border-radius:99px;
  padding:8px 13px;font-weight:700;font-size:13px;color:var(--tx);background:rgba(25,25,32,.85);cursor:pointer}
.seg{display:flex;gap:8px;padding:5px;background:var(--panel);border:1px solid var(--line);
  border-radius:15px;margin:8px 0 14px}
.seg button{flex:1;border:0;border-radius:11px;padding:11px;background:transparent;color:var(--mut);font-weight:750;cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:white}
.seg button.vip{color:var(--amb)}
.seg button.vip.on{background:linear-gradient(135deg,var(--v1),var(--v2));color:#17120a}
.plan{display:flex;align-items:center;gap:12px;padding:16px;margin:10px 0;background:linear-gradient(145deg,#1b1b23,#121217);
  border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.plan.vip{border-color:rgba(215,173,88,.45);background:linear-gradient(145deg,#282116,#17140f)}
.gb{width:66px;height:66px;flex:none;border-radius:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(239,89,100,.12);color:#ff8790}
.gb b{font-size:25px;line-height:1.1}.gb small{font-size:12px}
.plan.vip .gb{background:rgba(215,173,88,.14);color:var(--amb)}
.i{flex:1;min-width:0}.i h2{font-size:18px;margin:3px 0;font-weight:800}
.sub{font-size:12px;color:var(--mut)}
.badge{display:inline-block;background:rgba(215,173,88,.18);color:var(--amb);font-size:10px;
  font-weight:900;padding:3px 8px;border-radius:99px;letter-spacing:.5px}
.price{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.price b{font-size:23px}.price small{font-size:11px;color:var(--mut)}
.buy,.btn{border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,var(--a1),var(--a2));
  color:white;font-weight:800;cursor:pointer;box-shadow:0 5px 14px rgba(130,20,32,.2)}
.buy{margin-top:9px;padding:8px 15px;font-size:13px}
.plan.vip .buy{background:linear-gradient(135deg,var(--v1),var(--v2));color:#17120a}
.btn{min-height:42px}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--tx);box-shadow:none}
.btn.dark{background:#292932}
button:disabled{opacity:.48;cursor:not-allowed}
.card{padding:16px;margin:12px 0;background:rgba(21,21,27,.94);border:1px solid var(--line);border-radius:17px}
.card h3{margin:0 0 10px;font-size:16px}
.card p{color:var(--mut);font-size:13px;overflow-wrap:anywhere}
.steps{padding-left:22px;margin:8px 0;color:var(--mut)}
.steps li{padding:4px 0}
.code{padding:13px;margin:10px 0;border:1px dashed var(--a1);border-radius:10px;
  background:rgba(239,89,100,.08);font-size:18px;font-weight:800;overflow-wrap:anywhere;user-select:all}
.pt{padding-top:calc(env(safe-area-inset-top) + 18px)}
.ptitle{font-size:25px;margin:0 0 16px;font-weight:850}
.tour{padding:16px;margin-bottom:14px;border:1px solid rgba(215,173,88,.35);border-radius:17px;
  background:linear-gradient(135deg,rgba(215,173,88,.12),rgba(21,21,27,.95))}
.tour h3{margin:0 0 6px}.tour p{color:var(--mut);font-size:13px;margin:0 0 12px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));
  width:min(94%,540px);display:flex;gap:4px;padding:7px;background:rgba(21,21,27,.94);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);
  border-radius:28px;z-index:20;box-shadow:0 10px 35px rgba(0,0,0,.35)}
.tabs button{flex:1;min-width:0;border:0;background:none;color:var(--mut);font-size:10px;font-weight:650;
  border-radius:22px;padding:7px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button span{font-size:22px;line-height:1.1}.tabs button b{font-size:10px}
.tabs button.on{background:#09090c;color:#fff}
.crow{display:flex;gap:12px;align-items:center;padding:12px;margin:9px 0;background:rgba(21,21,27,.94);
  border:1px solid var(--line);border-radius:16px;min-width:0}
.crow.k{cursor:pointer}.crow.k:active{background:var(--panel2)}
.cav{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:800;
  background:linear-gradient(135deg,var(--a1),var(--a2));flex:none}
.cav.ad{background:linear-gradient(135deg,var(--v1),var(--v2));color:#17120a}
.cm{flex:1;min-width:0}.cn{font-weight:750;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cp{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct{font-size:11px;color:var(--mut);align-self:flex-start;white-space:nowrap}
.tag{font-size:9px;font-weight:850;padding:2px 7px;border-radius:99px;background:rgba(215,173,88,.17);color:var(--amb)}
.dot{width:8px;height:8px;border-radius:50%;background:#555;display:inline-block;margin-right:5px}
.dot.on{background:#3ecf8e}
.sheet{width:min(100%,560px);max-height:88dvh;overflow:auto;padding:16px;
  background:#14141a;border:1px solid var(--line);border-radius:22px 22px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.4);padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.sheet.f{height:100dvh;max-height:none;border-radius:0;display:flex;flex-direction:column;width:100%;max-width:680px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.head h2{font-size:18px;margin:0}
.x{border:1px solid var(--line);border-radius:50%;width:38px;height:38px;background:var(--panel2);color:var(--tx);font-size:17px;cursor:pointer;flex:none}
.sheet input:not([type=file]){width:100%;min-width:0;padding:13px 14px;border:1px solid var(--line);border-radius:12px;
  outline:none;background:#0c0c10;color:var(--tx);margin:6px 0}
.sheet input:focus,.card input:focus{border-color:var(--a1)}
.sheet .head+ p{color:var(--mut)}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1}
.msgs{overflow:auto;flex:1;min-height:120px;padding:8px 2px;display:flex;flex-direction:column;gap:9px}
.m{max-width:86%;padding:10px 12px;border-radius:14px;background:#25252e;color:var(--tx);
  align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap;font-size:14px}
.m.me{align-self:flex-end;background:#78232c}
.m small{display:block;margin-top:5px;text-align:right;color:#c4aeb0;font-size:10px}
.m .u{display:block;color:#f0b9be;font-size:11px;font-weight:800;margin-bottom:3px}
.m img,.m video{display:block;max-width:100%;max-height:320px;border-radius:10px;margin-top:7px}
.empty{margin:auto;text-align:center;color:var(--mut);font-size:13px;padding:24px}
.err{color:var(--danger);font-size:12px;margin:7px 0;overflow-wrap:anywhere}
.hint{color:var(--mut);font-size:12px}
.pf{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.av2{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--a1),var(--a2));font-size:21px;font-weight:800}
.coins{margin-left:auto;font-weight:850;color:var(--amb);white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{flex:1 1 145px}
.lsel{display:flex;gap:6px;margin-top:12px}
.lsel button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-weight:650;padding:10px 4px;border-radius:12px;cursor:pointer}
.lsel button.on{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent}
.mlist{overflow:auto;flex:1}
@media(min-width:600px){
  body{padding-top:28px}.hero{padding-top:38px}.bg{align-items:center;padding:20px}

:root{--bg:#000;--panel:#0b100d;--panel2:#111812;--line:#1c2520;--a1:#27e07a;--a2:#0a8f45;--mut:#8a9a91}
html{background:#000}
body{background:radial-gradient(ellipse at 50% -8%,rgba(39,224,122,.24),transparent 46%),radial-gradient(ellipse at 100% 45%,rgba(0,255,150,.08),transparent 40%),#000!important}
.bgc{background:#000}
.bg{background:rgba(0,0,0,.82)}
.hero h1{background:linear-gradient(90deg,#fff,#7dffb4 55%,#27e07a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero:after{color:#5dff9f}.eyebrow{color:#4dff94}.apple{color:#c4ffdc}.gallery-hint span{color:#4dff94}
.hlogo{box-shadow:0 0 0 7px rgba(39,224,122,.09),0 0 40px rgba(39,224,122,.3),0 14px 38px rgba(0,0,0,.6)}
.poster-card{border-color:rgba(39,224,122,.28);background:#0a100c}
.seg{background:#0a0f0c;border-color:#1c2520}.seg button.on{background:linear-gradient(135deg,#27e07a,#0a8f45);color:#02140a}
.plan{border-color:rgba(39,224,122,.38);background:linear-gradient(145deg,rgba(39,224,122,.15),#07100b)}
.gb{background:rgba(39,224,122,.16);color:#6dffa8}
.buy,.btn{background:linear-gradient(135deg,#27e07a,#0a8f45);color:#02140a;box-shadow:0 6px 18px rgba(39,224,122,.3)}
.btn.ghost{background:#101712;color:#fff;box-shadow:none}.btn.dark{background:#17201a;color:#fff;box-shadow:none}
a.btn{color:#02140a}a.btn.ghost{color:#fff}
.card{background:rgba(8,13,10,.94);border-color:#1c2520}
.code{border-color:#27e07a;background:rgba(39,224,122,.09)}
.tabs{background:rgba(5,9,7,.92);border-color:#1c2520}
.tabs button{position:relative}.tabs button.on{background:rgba(39,224,122,.17);color:#6dffa8}
.nb{position:absolute;top:1px;left:calc(50% + 4px);min-width:17px;height:17px;border-radius:9px;background:#27e07a;color:#02140a;font:800 10px/1 inherit;font-style:normal;display:grid;place-items:center;padding:0 4px}
.tour{border-color:rgba(39,224,122,.4);background:linear-gradient(135deg,rgba(39,224,122,.15),rgba(8,13,10,.95))}
.gs{background:rgba(8,13,10,.94);border-color:#1c2520}.gs .n{background:linear-gradient(135deg,#27e07a,#0a8f45);color:#02140a}
.lsel button.on{background:linear-gradient(135deg,#27e07a,#0a8f45);color:#02140a}
.ft{background:rgba(8,13,10,.92)}
.ft:nth-child(1){background:linear-gradient(145deg,rgba(39,224,122,.26),rgba(8,13,10,.92))}
.ft:nth-child(2){background:linear-gradient(145deg,rgba(0,212,161,.24),rgba(8,13,10,.92))}
.ft:nth-child(3){background:linear-gradient(145deg,rgba(182,242,58,.2),rgba(8,13,10,.92))}
.ft:nth-child(4){background:linear-gradient(145deg,rgba(0,255,150,.2),rgba(8,13,10,.92))}
.ft:nth-child(5){background:linear-gradient(145deg,rgba(45,212,191,.22),rgba(8,13,10,.92))}
.ft:nth-child(6){background:linear-gradient(145deg,rgba(74,222,128,.24),rgba(8,13,10,.92))}
.sheet{background:#050806}.sheet input:focus,.card input:focus{border-color:#27e07a}
/* Telegram-список чатов */
#pg-chats .ptitle{text-align:center}
#chatlist,#people{margin:0 -16px}
.crow{position:relative;background:transparent;border:0;border-radius:0;margin:0;padding:11px 16px;gap:13px;align-items:flex-start}
.crow::after{content:"";position:absolute;left:92px;right:0;bottom:0;border-bottom:1px solid rgba(255,255,255,.07)}
.crow.k:active{background:rgba(255,255,255,.05)}
.crow.pin{background:rgba(255,255,255,.055)}
.crow .cav{width:62px;height:62px;font-size:28px;color:#02140a;background:linear-gradient(135deg,#27e07a,#0a8f45)}
.crow:nth-child(3n+2) .cav{background:linear-gradient(135deg,#00d4a1,#00704f)}
.crow:nth-child(3n) .cav{background:linear-gradient(135deg,#b6f23a,#4a8f0a)}
.cn{font-size:17px;font-weight:800}
.cp{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:1.3;color:#8a9a91;margin-top:2px}
.ct{font-size:13px;margin-top:3px;text-align:right}
.ub{min-width:22px;height:22px;border-radius:11px;background:#27e07a;color:#02140a;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 6px;margin:8px 0 0 auto}
.pn{opacity:.55;margin-top:8px}
/* окно чата */
.sheet.f.tg,.sheet.f{background:#030504}
.tgh{justify-content:flex-start;gap:10px;padding:2px 2px 10px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:0}
.tgh .x{border:0;background:none;font-size:34px;line-height:1;width:34px;color:#27e07a}
.cav.sm{width:42px;height:42px;font-size:20px;flex:none}
.hm{display:flex;flex-direction:column;line-height:1.2}.hm span{font-size:12px;color:#27e07a}
.hintbar{background:rgba(39,224,122,.13);color:#9dffc6;font-size:13px;padding:10px 12px;border-radius:12px;margin:10px 0 0;font-weight:650}
.msgs{gap:6px;padding:12px 4px}
.m{background:#151d18;border-radius:18px 18px 18px 5px;padding:8px 12px 6px}
.m.me{background:linear-gradient(135deg,#1fbf62,#0b7a3b);border-radius:18px 18px 5px 18px;color:#fff}
.m.me small{color:#d3ffe4}
.m.ph{padding:4px}.m.ph img{margin:0;border-radius:14px;max-height:360px;cursor:zoom-in}.m.ph small{padding:0 8px 2px}
.m.ord{border:1px solid rgba(39,224,122,.55);background:#0a140e}
.tgi{align-items:center;padding-top:8px}
.tgi input,.row input{border-radius:99px!important;margin:0!important;background:#0b120d!important}
.clip{width:44px;height:44px;flex:none;display:grid;place-items:center;font-size:21px;cursor:pointer;border-radius:50%;background:#0b120d;border:1px solid var(--line)}
.snd{border-radius:50%!important;width:44px;height:44px;min-height:0;padding:0!important;flex:none}

/* ===== v4 ===== */
.poster-rail{align-items:flex-start}
.poster-card.w{background:#0a100c}.poster-card.w img{aspect-ratio:auto;object-fit:contain;cursor:zoom-in}
.balchip{position:absolute;left:16px;top:calc(env(safe-area-inset-top) + 14px);border:0;border-radius:99px;padding:8px 13px;font:inherit;font-weight:800;font-size:13px;color:#02140a;background:linear-gradient(135deg,#27e07a,#0a8f45);cursor:pointer}
.bal{font-size:32px;font-weight:900;margin:2px 0 12px;color:#6dffa8}
.wh{margin-top:12px}.whr{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut);padding:7px 0;border-top:1px solid rgba(255,255,255,.07)}
.pos{color:#6dffa8}.neg{color:#ff7a82}

/* ===== v5 ===== */
.banner{display:block;width:100%;border-radius:18px;margin:0 0 18px;box-shadow:0 0 34px rgba(39,224,122,.28)}
.cav.pic,.av2{overflow:hidden;background:#000;padding:0}
.cav img,.av2 img{width:100%;height:100%;object-fit:cover;display:block}
.av2{width:56px;height:56px;box-shadow:0 0 0 2px rgba(39,224,122,.5)}
.mini{width:20px;height:20px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px}

}

body{

}
.bgc{display:none!important}
.wrap{width:min(100% - 28px,590px)}
.hero{padding:34px 16px 22px}

.hero:after{content:"HAPP · CONNECT WITHOUT LIMITS";letter-spacing:2.4px;color:#79caff}
.hero h1{font-size:clamp(27px,7vw,36px);font-weight:950;background:linear-gradient(90deg,#fff 5%,#9bdcff 48%,#ff8fa3 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:14px;line-height:1.6}
.crown{border:1px solid rgba(255,212,59,.35)}
.sech,.ptitle{font-weight:900;letter-spacing:-.45px}
.feats{gap:9px}
.ft{border-radius:17px;backdrop-filter:blur(12px);border-color:var(--line)}
.seg{background:rgba(16,21,34,.92);border-color:var(--line);border-radius:16px}
.seg button{padding:12px 8px}
.seg button.on{background:linear-gradient(120deg,#ff304f,#754dff 58%,#00b8ff);color:white}
.plan,.card,.crow,.gs,.tour{border-color:var(--line);background:linear-gradient(145deg,rgba(20,29,47,.96),rgba(10,14,24,.97));box-shadow:0 10px 28px rgba(0,0,0,.18)}
.plan{border-radius:20px;padding:15px}
.plan.vip{border-color:rgba(255,212,59,.42);background:linear-gradient(145deg,rgba(74,49,12,.55),rgba(17,20,29,.98))}
.gb{border-radius:17px;background:linear-gradient(145deg,rgba(0,184,255,.22),rgba(117,72,255,.17));color:#8bdcff}
.buy,.btn{border-radius:13px;background:linear-gradient(110deg,#ff304f,#8d2dff 58%,#087fe8);box-shadow:0 7px 18px rgba(85,72,255,.22);transition:transform .16s ease,filter .16s ease}
.buy:active,.btn:active{transform:scale(.98);filter:brightness(1.12)}
.plan.vip .buy{background:linear-gradient(110deg,#ffe45c,#ff8a00);color:#1c1400}
.btn.ghost{background:#192338;border:1px solid var(--line);color:#f5f8ff;box-shadow:none}
.tabs{background:rgba(8,12,22,.92);border:1px solid rgba(134,174,226,.22);box-shadow:0 12px 38px rgba(0,0,0,.48)}
.tabs button{font-size:11px;min-height:48px}
.tabs button.on{background:linear-gradient(135deg,rgba(255,48,79,.22),rgba(0,184,255,.2));color:#fff}
.card{border-radius:19px;padding:17px}
.sheet{background:#0e1421;border-color:var(--line)}
.sheet input:not([type=file]){background:#080d18;border-color:#29364d;border-radius:13px;padding:14px}
.sheet input:focus{border-color:#35baff;box-shadow:0 0 0 3px rgba(53,186,255,.12)}
.crow{border-radius:16px}
.cav,.av2{box-shadow:0 0 0 3px rgba(0,184,255,.12)}
.code{border-color:#00b8ff;background:rgba(0,184,255,.08)}
.lsel button.on{background:linear-gradient(110deg,#ff304f,#754dff,#008fe8)}
.hide{display:none!important}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #65cfff;outline-offset:3px}
@media(min-width:700px){.wrap{width:min(100% - 40px,650px)}.hero{padding-top:44px}}

function bubble(r) {
  const mine = r.sender === "client", b = el("div", "m " + (mine ? "me" : "sel")), body = r.body || "";
  if (body.startsWith("[img]")) {
    const i = el("img"); i.src = SB + "/storage/v1/object/public/media/" + body.slice(5); i.loading = "lazy";
    i.onclick = () => window.open(i.src, "_blank"); b.classList.add("ph"); b.appendChild(i);
  } else if (body.startsWith("[order]")) {
    const [id, pk] = body.slice(7).split("|"), p = PLANS.find(x => x.k === pk);
    b.classList.add("ord");

async function sendShot(f) {
  const err = $("#cerr"); err.textContent = "";
  if (!f) return;
  if (f.size > 20 * 1024 * 1024) { err.textContent = t("big"); return; }
  $("#send").disabled = true; err.textContent = t("uploading");
  try {
    const ext = ((f.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg").slice(0, 5);
    const path = "pay/" + thread + "/" + crypto.randomUUID() + "." + ext;
    const r = await fetch(SB + "/storage/v1/object/media/" + path, {method:"POST", headers:{apikey:KEY, "Content-Type":f.type || "image/jpeg"}, body:f});
    if (!r.ok) throw new Error(t("upFail"));
    await rpc("send_message", {p_thread: thread, p_body: "[img]" + path});
    err.textContent = ""; first = true; loadChat();
  } catch (e) { err.textContent = em(e); }
  $("#send").disabled = false; $("#shot").value = "";
}

const avOf = n => AV[(((parseInt(n, 10) || 1) - 1) % AV.length + AV.length) % AV.length];
function avBox(cls, n) { const d = el("div", cls), i = el("img"); i.src = avOf(n); i.alt = ""; d.appendChild(i); return d; }

/* ---------- события ---------- */
if (Array.isArray(BG) && BG.length) BG.concat(BG[0]).forEach(s => { const i = el("img"); i.src = s; i.alt = ""; $("#bgc").appendChild(i); });
document.querySelectorAll("#tabs button").forEach(b => { b.onclick = () => go(b.dataset.go); });
$("#lg").onclick = () => { const o = ["ru", "tk", "en"]; setLang(o[(o.indexOf(lang) + 1) % 3]); };
$("#t-std").onclick = () => setTab("std");
$("#t-vip").onclick = () => setTab("vip");
$("#tourBtn").onclick = () => openGrp("tournaments");
$("#closeChat").onclick = closeChat;
$("#send").onclick = sendChat;
$("#txt").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); sendChat(); } };
$("#orderBg").onclick = e => { if (e.target.id === "orderBg") closeOrder(); };
$("#gX").onclick = closeGrp;
$("#gS").onclick = sendGrp;
$("#gTxt").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); sendGrp(); } };
$("#gMem").onclick = () => { $("#mBg").classList.add("on"); loadMembers(); };
$("#mX").onclick = () => $("#mBg").classList.remove("on");
$("#mBg").onclick = e => { if (e.target.id === "mBg") $("#mBg").classList.remove("on"); };
setInterval(touch, 60000);
$("#gBuy").onclick = () => go("shop");
$("#hChat").onclick = openChat;
$("#shot").onchange = e => sendShot(e.target.files[0]);
setInterval(loadPrev, 15000);
loadPrev();

applyLang();
loadMe();
checkOrder();
</script>
